plugins {
    id 'java'
    id 'eclipse'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id("xyz.jpenilla.run-velocity") version "3.1.0"
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'au.com.addstar.ccm'

// Centralised version: semver 1.0.<build>. Jenkins sets BUILD_NUMBER; first build = 1.0.1, local = 1.0.0.
def versionBase = findProperty('versionBase') ?: '1.0'
def buildNumber = System.getenv('BUILD_NUMBER')
version = (buildNumber != null && !buildNumber.isEmpty()) ? "${versionBase}.${buildNumber}" : "${versionBase}.0"

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "addstar"
        url = "https://maven.addstar.com.au/artifactory/all-release/"
    }
}

// If the VelocityControl JAR is in lib/ (e.g. when the version isn't in the Maven repo), use it for compilation.
def vcVersion = findProperty('vcVersion')
def vcJar = file("lib/VelocityControl-${vcVersion}.jar")
def useLocalVc = vcJar.exists()

dependencies {
    compileOnly("com.velocitypowered:velocity-api:3.4.0-SNAPSHOT")
    annotationProcessor("com.velocitypowered:velocity-api:3.4.0-SNAPSHOT")
    if (useLocalVc) {
        compileOnly(files(vcJar))
    } else {
        compileOnly(group: "org.mineacademy", name: "chatcontrol-velocity", version: vcVersion)
    }
    compileOnly("net.kyori:adventure-text-minimessage:4.26.1")
    // Velocity provides slf4j and Gson; everything else is shaded and relocated.
    implementation("redis.clients:jedis:8.0.2") {
        exclude group: "org.slf4j"
        exclude group: "com.google.code.gson"
    }
}

tasks {
    runVelocity {
        // Configure the Velocity version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        velocityVersion("3.4.0-SNAPSHOT")
    }
}

def targetJavaVersion = 25
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

def relocationBase = 'au.com.addstar.ccm.lib'
shadowJar {
    archiveClassifier = ''
    relocate 'redis.clients', "${relocationBase}.redis.clients"
    relocate 'org.apache.commons.pool2', "${relocationBase}.commons.pool2"
    relocate 'org.json', "${relocationBase}.json"
    mergeServiceFiles()
}

// Only the shaded JAR is a usable plugin, so don't build the plain one.
jar {
    enabled = false
}
assemble.dependsOn shadowJar

publishing {
    publications {
        maven(MavenPublication) {
            from components.shadow
            groupId = project.group
            artifactId = project.name
            version = project.version
        }
    }
    repositories {
        maven {
            name = 'artifactory'
            url = 'https://maven.addstar.com.au/artifactory/maven-release-local/'
            credentials {
                username = project.findProperty('artifactory_username') ?: System.getenv('ARTIFACTORY_USERNAME') ?: ''
                password = project.findProperty('artifactory_password') ?: System.getenv('ARTIFACTORY_PASSWORD') ?: ''
            }
        }
    }
}

// Copy generated POM to build/libs with Maven naming so CI can upload JAR + POM together
tasks.register('preparePublication', Copy) {
    dependsOn shadowJar, generatePomFileForMavenPublication
    from layout.buildDirectory.file("publications/maven/pom-default.xml")
    into layout.buildDirectory.dir('libs')
    def pomName = "${project.name}-${project.version}.pom"
    rename { pomName }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

def templateSource = file('src/main/templates')
def templateDest = layout.buildDirectory.dir('generated/sources/templates')
def generateTemplates = tasks.register('generateTemplates', Copy) { task ->
    def props = ['version': project.version]
    task.inputs.properties props

    task.from templateSource
    task.into templateDest
    task.expand props
}

sourceSets.main.java.srcDir(generateTemplates.map { it.outputs })

project.idea.project.settings.taskTriggers.afterSync generateTemplates
project.eclipse.synchronizationTasks(generateTemplates)
